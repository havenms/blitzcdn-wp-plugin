services:
  middleware:
    build: .
    container_name: blitzcdn-middleware
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Healthcheck is defined in the Dockerfile (checks /health)
    # Uncomment below if you prefer compose-managed healthcheck
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 5s

    # Optional: mount only if you plan to edit locally and rebuild quickly
    # volumes:
    #   - ./:/app

networks:
  default:
    name: blitzcdn-network
